<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- eyebrow label -->
  <text x="80" y="76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" letter-spacing="2" fill="#2ea043">OPEN SOURCE · CONTEXT ENGINEERING</text>

  <!-- terminal card -->
  <g transform="translate(80, 104)">
    <rect width="1040" height="130" rx="10" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="28" r="6" fill="#27c93f"/>
    <!-- prompt + result line -->
    <text x="28" y="68" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#8b949e">$ /wrap-it-up</text>
    <text x="28" y="100" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#ffffff" xml:space="preserve"><tspan fill="#8b949e">&#8594; </tspan><tspan fill="#e3b341">hot.md refreshed</tspan><tspan fill="#c9d1d9"> &#8212; 4 decisions, 2 lessons logged</tspan><tspan fill="#484f58"> (0.3s)</tspan></text>
  </g>

  <!-- large pull quote -->
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="38" fill="#f0f6fc">"Zero recap.</text>
  <text x="600" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="38" fill="#f0f6fc">Every session starts caught up."</text>
  <text x="600" y="444" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" fill="#6e7681">A plain-markdown, per-repo brain for Claude Code</text>

  <!-- footer: icon + project name -->
  <g transform="translate(600, 540)">
    <g transform="translate(-170, -14) rotate(-90)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#2ea043" stroke-width="4"
              stroke-dasharray="68 22" stroke-linecap="round"/>
      <polygon points="13,-9 20,0 13,9" fill="#2ea043"/>
    </g>
    <text x="-130" y="-7" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="28" font-weight="700" fill="#ffffff">wrap-it-up</text>
    <text x="0" y="30" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
          font-size="17" fill="#6e7681">github.com/thisismairaj/wrap-it-up</text>
  </g>
</svg>
